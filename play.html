<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>moixi · player</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <script>
    // Detecta ?embed=1 antes de pintar para evitar flash. Cuando se embebe el player
    // dentro de un iframe (game.html del arxiu) ocultamos el chrome propio.
    if (new URLSearchParams(location.search).has('embed')) {
      document.documentElement.classList.add('embed');
    }
  </script>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2vh;
    }
    .player {
      display: grid;
      gap: 1rem;
      width: min(100%, 640px);
      text-align: center;
    }
    .player header {
      display: flex; justify-content: space-between; align-items: baseline;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 0.4rem;
    }
    .player .credits {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-top: 0.5rem;
    }
    [data-mosi-canvas] {
      width: 100%;
      max-width: 100%;
    }

    /* Modo embed: el player vive dentro de un iframe del arxiu. Se oculta
       todo el chrome (header del juego, hints, divider, footer) y el canvas
       ocupa el alto disponible manteniendo aspecto cuadrado. */
    html.embed, html.embed body {
      background: transparent;
      padding: 0;
      margin: 0;
      min-height: 100dvh;
    }
    html.embed body { display: block; }
    html.embed .player {
      width: 100%;
      max-width: none;
      min-height: 100dvh;
      gap: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    html.embed .player header,
    html.embed .player .control-hints,
    html.embed .player .divider-glyphs,
    html.embed .player .studio-footer,
    html.embed .player .credits {
      display: none;
    }
    html.embed .canvas-wrap {
      margin: 0 auto;
      width: min(100dvh, 100%);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.embed [data-mosi-canvas] {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
    }
    /* el anillo ámbar respiratorio queda raro en embed pequeño, lo silenciamos */
    html.embed .canvas-wrap::before { display: none; }
    /* el d-pad táctil sobreescribe el juego dentro del iframe del arxiu;
       el contenedor padre (game.html) montará sus propios controles */
    html.embed [data-mosi-dpad] { display: none !important; }
  </style>
</head>
<body>
  <div class="player">
    <header>
      <h1 id="game-title">cargando…</h1>
    </header>
    <div class="canvas-wrap">
      <canvas data-mosi-canvas></canvas>
      <div class="play-overlay" id="play-overlay" role="button" tabindex="0" aria-label="empezar a jugar">
        <span class="overlay-text">click o teclas <span class="kbd-inline">↑↓←→</span> para jugar</span>
      </div>
    </div>
    <div class="control-hints">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <span class="hint-sep">moverse</span>
      <kbd>espacio</kbd> <span class="hint-sep">hablar / avanzar</span>
      <kbd>esc</kbd> <span class="hint-sep">cancelar</span>
    </div>
    <div class="divider-glyphs"></div>
    <footer class="studio-footer">
      <img class="mascot alive" src="./assets/mascot.svg" alt="">
      &nbsp;made in barcelona ☼ <a href="https://meowrhino.neocities.org">meowrhino studio</a> · inspirado en <a href="https://zenzoa.itch.io/mosi">mosi</a>
    </footer>
  </div>

  <script type="module">
    // Imports dinámicos con cache-bust. Evita que el browser sirva módulos viejos
    // tras cambios en el motor durante development. El HTML standalone exportado
    // no usa este path (export.js inline-a todo con blob URLs).
    const t = Date.now();
    const im = (p) => import(`${p}?t=${t}`).then(m => m.default);
    const [
      core, canvasMod, palettes, sprites, camera, lighting, keyboard, touch, mover,
      walls, interactable, dialog, inventory, world, transitions,
      script, stdlib, vars, audio, save,
    ] = await Promise.all([
      im('./core/index.js'),
      im('./modules/render/canvas.js'),
      im('./modules/render/palettes.js'),
      im('./modules/render/sprites.js'),
      im('./modules/render/camera.js'),
      im('./modules/render/lighting.js'),
      im('./modules/input/keyboard.js'),
      im('./modules/input/touch.js'),
      im('./modules/input/mover.js'),
      im('./modules/gameplay/walls.js'),
      im('./modules/gameplay/interactable.js'),
      im('./modules/gameplay/dialog.js'),
      im('./modules/gameplay/inventory.js'),
      im('./modules/gameplay/world.js'),
      im('./modules/gameplay/transitions.js'),
      im('./modules/script/mosi.js'),
      im('./modules/script/stdlib.js'),
      im('./modules/script/vars.js'),
      im('./modules/audio/beeps.js'),
      im('./modules/persistence/save.js'),
    ]);

    const url = new URLSearchParams(location.search).get('game') || './examples/garden.json';
    const gameData = await fetch(url).then(r => r.json());

    document.getElementById('game-title').textContent = gameData.name || 'moixi';
    document.title = `moixi · ${gameData.name || 'player'}`;

    core.load(gameData);

    core
      .use(canvasMod)
      .use(palettes)
      .use(sprites)
      .use(camera)
      .use(lighting)
      .use(keyboard)
      .use(touch)
      .use(mover)
      .use(walls)
      .use(interactable)
      .use(script)
      .use(stdlib)
      .use(vars)
      .use(dialog)
      .use(inventory)
      .use(world)
      .use(transitions)
      .use(audio)
      .use(save);

    // dispara roomEnter al inicio para que el módulo audio arranque la música
    core.bus.emit('roomEnter', { roomId: gameData.startRoom });

    core.start();

    // Overlay "click o teclas para jugar": se quita al primer input.
    const overlay = document.getElementById('play-overlay');
    if (overlay) {
      const hideOverlay = () => {
        overlay.classList.add('hidden');
        document.querySelector('.canvas-wrap')?.classList.add('playing');
        window.removeEventListener('keydown', hideOverlay);
        overlay.removeEventListener('click', hideOverlay);
      };
      window.addEventListener('keydown', hideOverlay);
      overlay.addEventListener('click', hideOverlay);
    }
  </script>
</body>
</html>
